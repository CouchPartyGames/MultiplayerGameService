# .github/workflows/helmfile-render.yml
#
# Renders every helmfile release to plain manifests under rendered/<env>/
# and opens (or updates) a PR so the rendered output can be reviewed.
 
name: Render helmfile
 
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Helmfile environment to render (leave empty for all)"
        required: false
        default: ""
  push:
    branches: [main]
    # Only re-render when inputs change. rendered/ is deliberately not listed,
    # so merging the render PR does not trigger another run.
    paths:
      - "helmfile.yaml"
      - "helmfile.yaml.gotmpl"
      - "helmfile.d/**"
      - "charts/**"
      - "values/**"
      - "environments/**"
 
permissions:
  contents: write
  pull-requests: write
 
concurrency:
  group: helmfile-render-${{ github.ref }}
  cancel-in-progress: true
 
env:
  HELM_VERSION: "v3.15.4"
  HELMFILE_VERSION: "1.1.0"   # pin to the version you use locally
  OUTPUT_DIR: rendered
 
jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Edit to match the environments defined in your helmfile.
        environment: [dev, staging, prod]

    steps:
      - name: Skip environments not requested
        id: gate
        run: |
          requested="${{ github.event.inputs.environment }}"
          if [[ -n "$requested" && "$requested" != "${{ matrix.environment }}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
 
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip == 'false'
 
      - uses: azure/setup-helm@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          version: ${{ env.HELM_VERSION }}
 
      - name: Install helmfile
        if: steps.gate.outputs.skip == 'false'
        run: |
          curl -fsSL -o /tmp/helmfile.tar.gz \
            "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/helmfile.tar.gz -C /tmp helmfile
          sudo install /tmp/helmfile /usr/local/bin/helmfile
          helmfile version
 
      - name: Render manifests
        if: steps.gate.outputs.skip == 'false'
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          target="${OUTPUT_DIR}/${ENVIRONMENT}"
 
          # Wipe first so removed releases/resources show up as deletions in the PR.
          rm -rf "$target"
          mkdir -p "$target"
 
          helmfile -e "$ENVIRONMENT" template \
            --output-dir "$target" \
            --output-dir-template '{{ .OutputDir }}/{{ .Release.Namespace }}/{{ .Release.Name }}'
 
          echo "### Rendered files for \`${ENVIRONMENT}\`" >> "$GITHUB_STEP_SUMMARY"
          find "$target" -type f | sort | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
 
      - name: Create or update PR
        if: steps.gate.outputs.skip == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          # Swap for a GitHub App token if you need CI to run on this PR
          # (PRs opened with GITHUB_TOKEN don't trigger other workflows).
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: ${{ env.OUTPUT_DIR }}/${{ matrix.environment }}/**
          branch: helmfile-render/${{ matrix.environment }}
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          commit-message: "chore(helmfile): render ${{ matrix.environment }} manifests"
          title: "Helmfile render: ${{ matrix.environment }}"
          body: |
            Rendered output of `helmfile -e ${{ matrix.environment }} template`
            for commit ${{ github.sha }}.
 
            Review the diff under `${{ env.OUTPUT_DIR }}/${{ matrix.environment }}/`
            to see exactly what will change in the cluster manifests.
 
            _Generated by the **${{ github.workflow }}** workflow, run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})._
          labels: helmfile-render
