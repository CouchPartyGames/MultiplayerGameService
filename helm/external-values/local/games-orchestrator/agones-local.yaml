# https://github.com/googleforgames/agones/blob/main/install/helm/agones/values.yaml
# https://agones.dev/site/docs/installation/install-agones/helm/

agones:
  
  # https://agones.dev/site/docs/guides/feature-stages/#feature-gates
  featureGates: "PlayerTracking=true"
  
  crds:
    install: true
    cleanupOnDelete: true
    cleanupJobTTL: 60

  metrics:
    prometheusEnabled: true
    prometheusServiceDiscovery: true
    # ServiceMonitor needs the monitoring.coreos.com CRDs (general/prometheus-crds),
    # which are not registered by sync-all-groups.yaml. Enable once they are installed.
    serviceMonitor:
      enabled: false
      interval: 30s
      
  controller:
    replicas: 1
    generateTLS: false
    logLevel: info
    annotations:
      region: local
      provider: minikube
    
  ping:
    install: false
    replicas: 1
    http:
      annotations:
        region: local
        provider: minikube
    udp:
      annotations:
        region: local
        provider: minikube

  allocator:
    replicas: 1
    generateTLS: false
    generateClientTLS: false
    # k3s ServiceLB binds each LoadBalancer port on the node, and Traefik already
    # holds 443 there, so the default port leaves the service pending. Keep http
    # and grpc on the same port, or the chart exposes grpc separately on 443.
    service:
      http:
        port: 8443
      grpc:
        port: 8443
    annotations:
      region: local
      provider: minikube

  extensions:
    replicas: 1
    logLevel: info
    annotations:
      region: local
      provider: minikube

gameservers:
  namespaces:
  - default
  minPort: 6000
  maxPort: 8000


# https://agones.dev/site/docs/installation/install-agones/helm/#helm-installation
helm:
  installTests: false
