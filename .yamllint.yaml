---
# yamllint rules for argocd/ manifests, matching section 1 of argocd/CODING-STANDARD.md.
extends: default

rules:
  # Two-space indentation, with list items indented beneath their key.
  indentation:
    spaces: 2
    indent-sequences: true
  # Every manifest starts with `---`.
  document-start:
    present: true
  trailing-spaces: enable
  new-line-at-end-of-file: enable
  # Chart values and Helm parameters often run long; line length is not part of the standard.
  line-length: disable
  # Kubernetes fields use true/false; allow yes/no only inside quoted strings.
  truthy:
    check-keys: false
