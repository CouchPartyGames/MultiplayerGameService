# Pre-commit hooks (https://pre-commit.com). Install once per clone with `pre-commit install`.
# The Terraform hooks call the local `terraform` binary; install it with
# terraform/scripts/terraform-install.sh.
repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.2
    hooks:
      # Fails when any .tf file is not in canonical format (same check as CI's `terraform fmt -check`).
      - id: terraform_fmt
        files: ^terraform/
        args:
          - --args=-check
          - --args=-diff

      # Runs `terraform init -backend=false` when needed, then `terraform validate`,
      # in each directory under terraform/ with changed .tf files.
      - id: terraform_validate
        files: ^terraform/
        args:
          - --hook-config=--retry-once-with-cleanup=true

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      # Checks argocd/ manifests against the YAML formatting rules in argocd/CODING-STANDARD.md.
      - id: yamllint
        files: ^argocd/.*\.yaml$
        args:
          - --strict
          - --config-file=.yamllint.yaml

  - repo: local
    hooks:
      # Runs `helm lint --strict` on each chart under helm/charts/ with changed files.
      # Calls the local `helm` binary; install it with helm/scripts/helm-install.sh.
      - id: helm-lint
        name: helm lint
        entry: helm/scripts/helm-lint.sh
        language: script
        files: ^helm/charts/

      # Runs `ct lint` (yamllint, Chart.yaml schema, helm lint, version bump check)
      # on charts changed against main, the same check as CI. Calls the local `ct`,
      # `yamllint`, and `yamale`; install them with helm/tools/ct-install.sh.
      - id: ct-lint
        name: chart-testing lint
        entry: helm/scripts/ct-lint.sh
        language: script
        files: ^(helm/charts/|ct\.yaml$)
        pass_filenames: false

      # Installs changed charts into the current kube context and runs their tests.
      # Manual only: `pre-commit run ct-install --hook-stage manual`. Needs Docker
      # and a running local cluster.
      - id: ct-install
        name: chart-testing install
        entry: helm/scripts/ct.sh install
        language: script
        files: ^(helm/charts/|ct\.yaml$)
        pass_filenames: false
        stages: [manual]
