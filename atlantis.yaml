# Atlantis repo-level config (https://www.runatlantis.io/docs/repo-level-atlantis-yaml.html).
# Each root module under terraform/envs/ is its own project, planned when its files or a child
# module under terraform/modules/ change.
version: 3
automerge: false
parallel_plan: true
parallel_apply: false

projects:
  - name: aws
    dir: terraform/envs/aws-123456789012
    workspace: default
    # Keep in sync with TERRAFORM_VERSION in terraform/tools/version.sh.
    terraform_version: v1.16.4
    autoplan:
      when_modified: ["*.tf", ".terraform.lock.hcl", "../../modules/**/*.tf"]
      enabled: true

  - name: azure
    dir: terraform/envs/azure-00000000-0000-0000-0000-000000000000
    workspace: default
    terraform_version: v1.16.4
    autoplan:
      when_modified: ["*.tf", ".terraform.lock.hcl", "../../modules/**/*.tf"]
      enabled: true

  - name: gcp
    dir: terraform/envs/gcp-multiplayer-demo
    workspace: default
    terraform_version: v1.16.4
    autoplan:
      when_modified: ["*.tf", ".terraform.lock.hcl", "../../modules/**/*.tf"]
      enabled: true
