---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo
  namespace: argocd
  labels:
    environment: local
    purpose: promotion
spec:
  project: infra

  sources:
    - repoURL: git@github.com:CouchPartyGames/MultiplayerGamesService.git
      targetRevision: main
      ref: myRepo
    - chart: kargo
      repoURL: ghcr.io/akuity/kargo-charts
      targetRevision: 1.11.5
      helm:
        valueFiles:
          - $myRepo/helm/external-values/local/infra/kargo-local.yaml

  destination:
    name: in-cluster
    namespace: kargo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true

  revisionHistoryLimit: 3
