---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-cd
  namespace: argocd

  labels:
    environment: local
    purpose: cont-delivery

spec:
  project: infra

  sources:
    - repoURL: git@github.com:CouchPartyGames/MultiplayerGamesService.git
      targetRevision: main
      ref: myRepo
    - chart: argo-cd
      repoURL: https://argoproj.github.io/argo-helm
      targetRevision: 5.24.1
      helm:
        valueFiles:
          - $myRepo/helm/external-values/local/argocd-local.yaml

  destination:
    name: in-cluster
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true

  revisionHistoryLimit: 3
