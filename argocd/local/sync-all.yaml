---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-projects-sync
  namespace: argocd

  labels:
    purpose: sync
spec:
  project: default

  source:
    repoURL: git@github.com:CouchPartyGames/MultiplayerGamesService.git
    path: argocd/local/infra
    targetRevision: HEAD

  destination:
    namespace: default
    name: in-cluster

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true

