---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agones-local
  namespace: argocd

  labels:
    environment: local
spec:
  project: hosting-local

  sources:
  - repoURL: git@github.com:CouchPartyGames/MultiplayerGameService.git
    targetRevision: main 
    ref: myRepo
  - repoURL: https://agones.dev/chart/stable
    chart: agones
    targetRevision: 1.61.0
    helm:
      releaseName: agones
      valueFiles:
      - $myRepo/helm/external-values/local/games-orchestrator/agones-local.yaml

  destination:
    name: in-cluster
    namespace: agones-system

  syncPolicy:
    #automated: {}
      #prune: true
      #selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 15s

  revisionHistoryLimit: 3
