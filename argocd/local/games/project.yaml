---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: games
  namespace: argocd

  # finalizers:
  #   - resources-finalizer.argocd.argoproj.io

  labels:
    environment: local
    region: local
spec:
  description: Dedicated Game Hosting for Local Environment

  sourceRepos:
    - 'https://couchpartygames.github.io/cpg-helm'
    - 'git@github.com:CouchPartyGames/MultiplayerGameService.git'

  destinations:
    - namespace: '!agones-system'
      name: '*'
    - namespace: '!kube-system'
      name: '*'
    - namespace: '*'
      name: '*'

  clusterResourceWhitelist:
    # - group: 'agones.dev'
    #   kind: 'Fleet'
    # - group: 'autoscaling.agones.dev'
    #   kind: 'FleetAutoscaler'
    # - group: 'apps'
    #   kind: 'Service'
    # - group: 'apps'
    #   kind: 'Deployment'
    # - group: ''
    #   kind: 'NetworkPolicy'
    - group: '*'
      kind: '*'

  namespaceResourceWhitelist:
    # - group: 'agones.dev'
    #   kind: 'Fleet'
    - group: '*'
      kind: '*'
