---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: open-match-appset
  namespace: argocd

  labels:
    environment: local
spec:
  generators:
    - list:
        elements:
          - cluster: "in-cluster"
            region: "local"
            version: "1.8.1"
  template:
    metadata:
      name: 'open-match-{{region}}'
      labels:
        region: '{{region}}'
        environment: local
    spec:
      project: matchmaking-local

      source:
        chart: open-match
        repoURL: https://open-match.dev/chart/stable
        targetRevision: '{{version}}'
        helm:
          values: |
            open-match-override:
              enabled: "true"


      destination:
        name: '{{cluster}}'
        namespace: open-match

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: 3
