name: helm

on:
  pull_request:
    paths:
      - "helm/charts/**"
      - "helm/scripts/version.sh"
      - ".github/workflows/helm.yaml"
      - "ct.yaml"
  push:
    branches: [main]
    paths:
      - "helm/charts/**"
      - "helm/scripts/version.sh"
      - ".github/workflows/helm.yaml"
      - "ct.yaml"

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # ct compares against the target branch to find changed charts.
          fetch-depth: 0

      - id: version
        run: |
          source helm/scripts/version.sh
          echo "helm=$HELM_VERSION" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@v5
        with:
          version: ${{ steps.version.outputs.helm }}

      # ct lint runs yamllint and yamale, which need Python.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: helm/chart-testing-action@v2.9.0

      - name: ct list-changed
        id: list-changed
        run: |
          # On push to main there is no diff against the target branch, so test every chart.
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "args=--all" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(ct list-changed --config ct.yaml)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ct lint
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --config ct.yaml ${{ steps.list-changed.outputs.args }}

      - uses: helm/kind-action@v1
        if: steps.list-changed.outputs.changed == 'true'

      - name: ct install
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --config ct.yaml ${{ steps.list-changed.outputs.args }}
