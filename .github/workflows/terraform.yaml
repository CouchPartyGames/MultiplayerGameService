name: terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yaml"
      - ".tflint.hcl"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yaml"
      - ".tflint.hcl"

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          source terraform/version.sh
          echo "terraform=$TERRAFORM_VERSION" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [terraform/aws, terraform/azure, terraform/gcp]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        working-directory: .
        run: |
          source terraform/version.sh
          echo "terraform=$TERRAFORM_VERSION" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate -no-color

  tflint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [terraform/aws, terraform/azure, terraform/gcp]
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      - name: tflint init
        run: tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: tflint
        run: tflint --chdir=${{ matrix.dir }} --config="$GITHUB_WORKSPACE/.tflint.hcl" --format=compact
