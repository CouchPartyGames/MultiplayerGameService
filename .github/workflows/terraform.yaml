name: terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yaml"
      - ".tflint.hcl"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yaml"
      - ".tflint.hcl"

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          source terraform/tools/version.sh
          echo "terraform=$TERRAFORM_VERSION" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - terraform/envs/aws-123456789012
          - terraform/envs/azure-00000000-0000-0000-0000-000000000000
          - terraform/envs/gcp-multiplayer-demo
          - terraform/modules/aws/eks
          - terraform/modules/aws/s3-terraform-state
          - terraform/modules/azure/aks
          - terraform/modules/gcp/gke
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        working-directory: .
        run: |
          source terraform/tools/version.sh
          echo "terraform=$TERRAFORM_VERSION" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate -no-color

  tflint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - terraform/envs/aws-123456789012
          - terraform/envs/azure-00000000-0000-0000-0000-000000000000
          - terraform/envs/gcp-multiplayer-demo
          - terraform/modules/aws/eks
          - terraform/modules/aws/s3-terraform-state
          - terraform/modules/azure/aks
          - terraform/modules/gcp/gke
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      - name: tflint init
        run: tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: tflint
        run: tflint --chdir=${{ matrix.dir }} --config="$GITHUB_WORKSPACE/.tflint.hcl" --format=compact

  # Checks each env README against terraform/envs/README.template.md, and requires every
  # env whose configuration changed in this PR to add a changelog entry with this PR's number.
  env-docs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: env docs check
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: terraform/scripts/env-docs-check.sh --base "origin/$BASE_REF" --pr "$PR_NUMBER"
