# .github/workflows/digger-sync-projects.yml
# Once a day, compares the projects in digger.yml with the Terraform root modules in
# terraform/envs/ and opens (or updates) a PR that adds new envs and removes projects
# whose directory is gone. When digger.yml is already in sync, it closes any open PR.
#
# Needs "Allow GitHub Actions to create and approve pull requests" enabled under
# Settings > Actions > General. PRs opened with GITHUB_TOKEN don't trigger other workflows.

name: Digger Sync Projects

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write # push the sync branch
  pull-requests: write # open and update the PR

concurrency:
  group: digger-sync-projects
  cancel-in-progress: false

env:
  DIGGER_CONFIG: digger/digger.yml # change to digger.yml when the config moves to the repo root
  SYNC_BRANCH: chore/digger-sync-projects

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # yq (mikefarah v4) is preinstalled on ubuntu-latest runners.
      - name: Sync digger.yml projects with terraform/envs
        id: sync
        run: |
          summary="$(bash digger/scripts/digger-missing-projects.sh "$DIGGER_CONFIG")"
          echo "$summary"
          {
            echo "summary<<SUMMARY_EOF"
            echo "$summary"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ env.SYNC_BRANCH }}
          delete-branch: true # closes the PR once main is back in sync
          add-paths: ${{ env.DIGGER_CONFIG }}
          commit-message: "chore(digger): sync projects with terraform/envs"
          title: "chore(digger): sync projects with terraform/envs"
          body: |
            The daily `Digger Sync Projects` workflow found `${{ env.DIGGER_CONFIG }}` out of step with the root modules in `terraform/envs/`:

            ${{ steps.sync.outputs.summary }}

            New projects use the `default` workflow. Before merging, set `workflow` and `depends_on` where an env needs something else, such as `prod`.

            Generated by `digger/scripts/digger-missing-projects.sh`; run it locally with `--check` to preview.
