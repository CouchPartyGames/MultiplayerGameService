# Github workflow to check for terraform drift

on:
  schedule:
    - cron: "0 6 * * 1-5" # weekdays 06:00 UTC
jobs:
  drift:
    steps:
      - uses: diggerhq/digger@<release-tag>
        with:
          mode: drift-detection
          drift-detection-slack-notification-url: ${{ secrets.DRIFT_SLACK_WEBHOOK }}
