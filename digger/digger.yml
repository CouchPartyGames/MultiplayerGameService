# digger.yml — lives at the repo root
# Each "project" is a Terraform root module Digger plans/applies independently.

projects:
  - name: networking-staging
    dir: infra/staging/networking
    workflow: default

  - name: eks-staging
    dir: infra/staging/eks
    depends_on: ["networking-staging"] # applied after networking
    workflow: default

  - name: eks-prod
    dir: infra/prod/eks
    workflow: prod # stricter workflow below

workflows:
  default:
    plan:
      steps:
        - init
        - plan
    apply:
      steps:
        - apply

  prod:
    plan:
      steps:
        - init
        - run: "checkov -d . --quiet" # static analysis before plan
        - plan
    apply:
      steps:
        - apply
    workflow_configuration:
      on_pull_request_pushed: ["digger plan"]
      on_pull_request_closed: ["digger unlock"]
      on_commit_to_default: ["digger unlock"]
