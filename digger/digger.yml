# digger.yml — lives at the repo root
# Digger generates a project for each Terraform root module (a directory with .tf
# files) that a block's include glob matches, and plans/applies each independently.

generate_projects:
  blocks:
    - block_name: staging
      include: "infra/staging/**"
      workflow: default

    - block_name: prod
      include: "infra/prod/**"
      workflow: prod # stricter workflow below

workflows:
  default:
    plan:
      steps:
        - init
        - plan
    apply:
      steps:
        - apply

  prod:
    plan:
      steps:
        - init
        - run: "checkov -d . --quiet" # static analysis before plan
        - plan
    apply:
      steps:
        - apply
    workflow_configuration:
      on_pull_request_pushed: ["digger plan"]
      on_pull_request_closed: ["digger unlock"]
      on_commit_to_default: ["digger unlock"]
